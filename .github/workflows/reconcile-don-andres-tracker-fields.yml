name: Reconcile Don Andres Tracker Checkpoints

on:
  push:
    paths:
      - '.github/workflows/reconcile-don-andres-tracker-fields.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update current-cycle checkpoint text
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path('refinement/Deck_Refinement_Tracker_2026-10-12.csv')
          with path.open(newline='', encoding='utf-8-sig') as f:
              reader = csv.DictReader(f)
              fields = reader.fieldnames
              rows = list(reader)
          for row in rows:
              if row['deck_id'] == 'Don_Andres__the_Renegade':
                  row['fresh_oracle_identity_check'] = 'PASS — fresh current-cycle Oracle cache and SHA-bound complete gate 2026-10-14 verified the exact approved 100-card candidate within B/R/U color identity.'
                  row['fresh_official_legality_check'] = 'PASS — exact SHA-bound approved candidate passed current official Commander legality verification on 2026-10-14; no project exception required.'
                  row['official_named_ban_list_checkpoint'] = 'PASS — current 2026-10-14 approval gate found no unexpected Commander-banned card; no project exception required.'
                  break
          else:
              raise SystemExit('Don Andres tracker row not found')
          with path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
          PY

      - name: Commit tracker reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'grixis-lock-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add refinement/Deck_Refinement_Tracker_2026-10-12.csv
          git diff --cached --quiet && exit 0
          git commit -m 'Reconcile Don Andres current Oracle and legality checkpoints'
          git push