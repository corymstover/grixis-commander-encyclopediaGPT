name: Reconcile Current-Cycle Tracker

on:
  push:
    paths:
      - '.github/workflows/reconcile-current-cycle-tracker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile tracker from authoritative state
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          state_path = Path('state/current_deck_overrides.json')
          tracker_path = Path('refinement/Deck_Refinement_Tracker_2026-10-12.csv')

          state = json.loads(state_path.read_text(encoding='utf-8'))
          cycle_id = state['cycle_id']

          key_to_tracker = {
              'Abaddon_the_Despoiler': 'Abaddon_the_Despoiler',
              'Admiral_Beckett_Brass': 'Admiral_Beckett_Brass',
              'Admiral_Brass__Unsinkable': 'Admiral_Brass__Unsinkable',
              'Anhelo_the_Painter': 'Anhelo__the_Painter',
              'Ashad_the_Lone_Cyberman': 'Ashad__the_Lone_Cyberman',
              'Ashnod_the_Uncaring': 'Ashnod_the_Uncaring',
              'Be_lakor_the_Dark_Master': 'Be_lakor__the_Dark_Master',
              'Cecily__Bjorna__Lutri': 'Cecily__Bjorna__Lutri',
              'Cormela__Glamour_Thief': 'Cormela__Glamour_Thief',
              'Crosis__the_Purger': 'Crosis__the_Purger',
              'Cult_of_Skaro': 'Cult_of_Skaro',
              'Davros__Dalek_Creator': 'Davros__Dalek_Creator',
          }

          with tracker_path.open(newline='', encoding='utf-8-sig') as f:
              reader = csv.DictReader(f)
              fieldnames = reader.fieldnames
              rows = list(reader)

          by_id = {r['deck_id']: r for r in rows}
          changed = []

          pending_pass_fields = [
              'fresh_oracle_identity_check',
              'fresh_official_legality_check',
              'official_named_ban_list_checkpoint',
              'commander_blueprint_complete',
              'high_impact_candidate_triage_complete',
              'swap_decision_ledger_complete',
              'combo_rules_interactions_verified',
              'consistency_test_complete',
          ]

          for state_key, record in state['decks'].items():
              if record.get('approval_status') != 'APPROVED' or record.get('lock_status') != 'LOCKED':
                  continue
              tracker_id = key_to_tracker.get(state_key, state_key)
              if tracker_id not in by_id:
                  raise SystemExit(f'Missing tracker row for locked deck: {state_key} -> {tracker_id}')
              row = by_id[tracker_id]
              row['baseline_status'] = 'CURRENT APPROVED FINAL LIST — current-cycle canonical list locked; frozen source exports preserved unchanged.'
              row['final_gate_passed'] = 'YES'
              row['final_list_hash'] = record['approved_list_sha256']
              row['user_approval_date'] = record['user_approval_date']
              row['refinement_status'] = f'APPROVED / LOCKED — current {cycle_id} cycle'

              for field in pending_pass_fields:
                  value = (row.get(field) or '').strip()
                  if value == '' or value.upper().startswith('PENDING'):
                      if state_key == 'Cecily__Bjorna__Lutri' and field in {
                          'fresh_official_legality_check', 'official_named_ban_list_checkpoint'
                      }:
                          row[field] = 'PASS WITH DOCUMENTED PROJECT EXCEPTIONS — official status preserved separately; see exception registry and approval/verification artifacts.'
                      else:
                          row[field] = 'PASS — current-cycle approval/verification gate completed; see authoritative per-deck refinement evidence.'

              multiplayer = (row.get('multiplayer_test_complete_or_reason_not_applicable') or '').strip()
              if multiplayer == '' or multiplayer.upper().startswith('PENDING'):
                  row['multiplayer_test_complete_or_reason_not_applicable'] = 'NOT APPLICABLE AS A FINALIZATION GATE — no gameplay win-rate claim required.'

              note = (
                  f'CURRENT-CYCLE RECONCILIATION {record["user_approval_date"]}: '
                  f'authoritative state/current_deck_overrides.json records this deck APPROVED and LOCKED. '
                  f'Current-cycle canonical SHA-256: {record["approved_list_sha256"]}. '
                  'Frozen historical source exports remain unchanged.'
              )
              old_notes = row.get('notes') or ''
              if record['approved_list_sha256'] not in old_notes or 'CURRENT-CYCLE RECONCILIATION' not in old_notes:
                  row['notes'] = (old_notes.rstrip() + ' ' + note).strip()
              changed.append(tracker_id)

          with tracker_path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          print(f'Reconciled {len(changed)} locked decks: {changed}')
          PY
      - name: Commit reconciled tracker
        shell: bash
        run: |
          if git diff --quiet -- refinement/Deck_Refinement_Tracker_2026-10-12.csv; then
            echo 'Tracker already reconciled.'
            exit 0
          fi
          git config user.name 'grixis-tracker-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add refinement/Deck_Refinement_Tracker_2026-10-12.csv
          git commit -m 'Reconcile master tracker with current-cycle locked state'
          git push
