name: Project Quality Gates

on:
  push:
    branches: ["main", "refinement/**", "automation/**"]
    paths:
      - ".github/workflows/project-quality-gates.yml"
      - ".github/workflows/refresh-scryfall-metadata.yml"
      - ".github/workflows/verify-baseline.yml"
      - "scripts/**"
      - "tests/**"
      - "requirements-scryfall.txt"
      - "source-package/GrixisFINAL_62Decks_CSV_TXT_2026-10-12.tar.gz"
      - "source-package/Grixis_Independent_Deck_Hash_Manifest_2026-10-12.csv"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/project-quality-gates.yml"
      - ".github/workflows/refresh-scryfall-metadata.yml"
      - ".github/workflows/verify-baseline.yml"
      - "scripts/**"
      - "tests/**"
      - "requirements-scryfall.txt"
      - "source-package/GrixisFINAL_62Decks_CSV_TXT_2026-10-12.tar.gz"
      - "source-package/Grixis_Independent_Deck_Hash_Manifest_2026-10-12.csv"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scryfall.txt
      - name: Install metadata dependency for tests
        run: python -m pip install --disable-pip-version-check -r requirements-scryfall.txt
      - name: Run repository unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check workflow trigger and output contracts
        run: python scripts/check_workflow_contracts.py
      - name: Verify frozen 62-deck source package
        run: python scripts/verify_baseline.py
