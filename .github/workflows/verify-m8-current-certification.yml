name: M8 versioned exact-current-SHA certification (pending until final acceptance)

on:
  pull_request:
    paths:
      - 'architecture/CURRENT_SHA_CERTIFICATION_V1.md'
      - 'refinement/verification/m8_current_release_evidence_v1.json'
      - 'scripts/verify_m8_current_certification.py'
      - 'tests/test_m8_current_certification.py'
      - 'tests/test_m8_admiral_brass_unsinkable_current.py'
      - 'tests/test_m8_anhelo_painter_current.py'
      - 'tests/test_m8_ashad_lone_cyberman_current.py'
      - 'tests/test_m8_batch6_to_10_current_quality.py'
      - 'tests/test_m8_batch11_to_15_current_quality.py'
      - 'tests/test_m8_batch16_to_20_current_quality.py'
      - 'refinement/verification/m8_quality_scope/Admiral_Brass__Unsinkable_dfa192cce0d92562.md'
      - 'refinement/verification/m8_quality_scope/Anhelo__the_Painter_865b3a16567f1cb8.md'
      - 'refinement/verification/m8_quality_scope/Ashad__the_Lone_Cyberman_352911498345e78b.md'
      - 'refinement/verification/m8_quality_scope/Ashnod_the_Uncaring_a045579b6f9d21f5.md'
      - 'refinement/verification/m8_quality_scope/Be_lakor_the_Dark_Master_2107f02e7a5303ee.md'
      - 'refinement/verification/m8_quality_scope/Cecily__Bjorna__Lutri_e4028f06d2d928ad.md'
      - 'refinement/verification/m8_quality_scope/Cormela__Glamour_Thief_d91ac1ab1dc543ee.md'
      - 'refinement/verification/m8_quality_scope/Crosis__the_Purger_a2f842355958dc85.md'
      - 'refinement/verification/m8_quality_scope/Cult_of_Skaro_e7c264409bd23bd6.md'
      - 'refinement/verification/m8_quality_scope/Davros__Dalek_Creator_96c6b1cde56eb79d.md'
      - 'refinement/verification/m8_quality_scope/Doctor_Doom__King_of_Latveria_7f74aa25cbbc47d4.md'
      - 'refinement/verification/m8_quality_scope/Don_Andres__the_Renegade_59c62e50874816a4.md'
      - 'refinement/verification/m8_quality_scope/Dr__Eggman_3ef9dc5bcda84834.md'
      - 'refinement/verification/m8_quality_scope/Edea__Possessed_Sorceress_a039a79c6205c3dc.md'
      - 'refinement/verification/m8_quality_scope/Edward_Kenway_8c01f2be6190be3e.md'
      - 'refinement/verification/m8_quality_scope/Evelyn__the_Covetous_c3f6862c6f449877.md'
      - 'refinement/verification/m8_quality_scope/Fire_Lord_Azula_77ac26a4f4ff70d0.md'
      - 'refinement/verification/m8_quality_scope/Garza_Zol__Plague_Queen_353381caa82e6804.md'
      - '.github/workflows/verify-m8-current-certification.yml'
  push:
    branches: [main]
    paths:
      - 'refinement/verification/m8_current_release_evidence_v1.json'
      - 'scripts/verify_m8_current_certification.py'
  workflow_dispatch:

jobs:
  verify-current-release-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all 62 owner-approved exact current sources and versioned evidence boundary
        run: python scripts/verify_m8_current_certification.py --check
      - name: Fail-closed negative gate tests
        run: python -m unittest discover -s tests -p test_m8_current_certification.py -v
      - name: Verify Admiral Brass Unsinkable exact current 99 and original bounded cases
        run: python -m unittest discover -s tests -p test_m8_admiral_brass_unsinkable_current.py -v
      - name: Verify Anhelo Painter exact Rev2 99 and original bounded cases
        run: python -m unittest discover -s tests -p test_m8_anhelo_painter_current.py -v
      - name: Verify Ashad Lone Cyberman exact Rev3 99 and original bounded cases
        run: python -m unittest discover -s tests -p test_m8_ashad_lone_cyberman_current.py -v
      - name: Verify five exact-current decks 6-10 with 70 original adversarial case scopes
        run: python -m unittest discover -s tests -p test_m8_batch6_to_10_current_quality.py -v
      - name: Verify five exact-current decks 11-15 with 67 original adversarial case scopes
        run: python -m unittest discover -s tests -p test_m8_batch11_to_15_current_quality.py -v
      - name: Verify five exact-current decks 16-20 with 70 original adversarial case scopes
        run: python -m unittest discover -s tests -p test_m8_batch16_to_20_current_quality.py -v
      - name: Recheck original exact M7 certification transfers
        run: python scripts/verify_m7_certification_transfer.py --check
      - name: Confirm that the prior archive remains an explicitly unaccepted candidate
        run: python scripts/build_m8_candidate_export.py --check
