name: Finalize Obeka Brute Chronologist approval once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/finalize-obeka-brute-chronologist-approval-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Finalize exact approved Obeka candidate
        run: python scripts/finalize_obeka_brute_chronologist_approval_once.py

      - name: Commit finalized approval state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/current_deck_overrides.json \
                  refinement/Deck_Refinement_Tracker_2026-10-12.csv \
                  refinement/decklists/Obeka_Brute_Chronologist_Approved_2026-10-15.txt \
                  refinement/approvals/Obeka_Brute_Chronologist_Approved_2026-10-15.md \
                  refinement/decisions/Obeka_Brute_Chronologist_Candidate_Decisions_2026-10-15.md
          git commit -m "Approve and lock Obeka Brute Chronologist [skip ci]"
          git push origin HEAD:main
