name: "M7 Deck 25 Kefka exact owner ZIP two-swap, case transfer and other-61 preservation"

on:
  pull_request:
    paths:
      - "state/current_deck_overrides.json"
      - "refinement/decklists/Kefka_Court_Mage_M7_Rev1_Approved_2026-10-28.txt"
      - "refinement/verification/m7_certification_transfer/Kefka__Court_Mage_14277f6e9774c5ef.json"
      - "tests/test_m7_kefka_25_owner_lock.py"
      - ".github/workflows/verify-m7-kefka-25-owner-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-exact-source-and-scoped-cases:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify 100 exact raw bytes, two replacements, owner receipt, 5 P0/9 P1 records and untouched 61 decks
        env:
          BASE_REF_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -m unittest discover -s tests -p 'test_m7_kefka_25_owner_lock.py' -v
