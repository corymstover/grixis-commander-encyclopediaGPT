name: Audit frozen Abaddon baseline against pinned Scryfall overlay

on:
  workflow_dispatch:
  push:
    branches: ["refinement/**"]
    paths:
      - ".github/workflows/verify-abaddon-baseline-audit.yml"
      - "scripts/audit_abaddon_baseline_metadata.py"
      - "tests/test_audit_abaddon_baseline_metadata.py"
      - "source-package/GrixisFINAL_62Decks_CSV_TXT_2026-10-12.tar.gz"
      - "refinement/metadata_audit/Current_Scryfall_Metadata_Overlay_2026-10-12.csv"

permissions:
  contents: read

jobs:
  audit-abaddon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run audit helper tests
        run: python -m unittest discover -s tests -p 'test_audit_abaddon_baseline_metadata.py' -v
      - name: Audit exact frozen baseline against metadata overlay
        run: python scripts/audit_abaddon_baseline_metadata.py --json-output /tmp/abaddon-audit.json --csv-output /tmp/abaddon-audit.csv
      - name: Preserve machine-readable audit output
        uses: actions/upload-artifact@v4
        with:
          name: abaddon-frozen-baseline-metadata-audit
          path: |
            /tmp/abaddon-audit.json
            /tmp/abaddon-audit.csv
          if-no-files-found: error
          retention-days: 60
