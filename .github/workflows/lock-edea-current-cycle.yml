name: Lock Edea current-cycle approval

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/lock-edea-current-cycle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile approved Edea state and tracker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          python - <<'PY'
          from pathlib import Path
          import csv
          import hashlib
          import json

          expected_sha = "fd560a9b0777088b3ad1684ded030566c894faa206ddf6763b74d95d82c532e4"
          candidate_path = Path("refinement/decklists/Edea_Possessed_Sorceress_Approval_Candidate_2026-10-14.txt")
          approved_path = Path("refinement/decklists/Edea_Possessed_Sorceress_Approved_2026-10-14.txt")

          candidate = candidate_path.read_bytes()
          approved = approved_path.read_bytes()
          candidate_sha = hashlib.sha256(candidate).hexdigest()
          approved_sha = hashlib.sha256(approved).hexdigest()
          if candidate_sha != expected_sha:
              raise SystemExit(f"candidate SHA mismatch: {candidate_sha}")
          if approved_sha != expected_sha:
              raise SystemExit(f"approved SHA mismatch: {approved_sha}")
          if candidate != approved:
              raise SystemExit("approved artifact does not byte-match approval candidate")

          state_path = Path("state/current_deck_overrides.json")
          state = json.loads(state_path.read_text())
          state.setdefault("decks", {})["Edea__Possessed_Sorceress"] = {
              "approval_status": "APPROVED",
              "lock_status": "LOCKED",
              "final_gate_passed": True,
              "user_approval_date": "2026-10-14",
              "current_stage": "LOCKED",
              "approved_list_sha256": expected_sha,
              "quality_gate_version": "Deck Quality Gates v3 + mandatory whole-list audit",
              "approval_basis": "Explicit user approval of the exact SHA-bound Edea approval candidate after mandatory 99-slot whole-list audit, candidate exhaustion, adversarial red-team review, zero-new-material-improvement closure, fresh Oracle/rules verification, current official Commander legality verification, and complete fail-closed gate PASS.",
              "complete_gate_artifact": "refinement/verification/edea_possessed_sorceress_2026-10-14/gate_output/Edea_Possessed_Sorceress_2026-10-14_Complete_Gate.json",
              "whole_list_audit_artifact": "refinement/decisions/Edea_Possessed_Sorceress_Current_Cycle_Decisions_2026-10-14.md",
              "approved_list_artifact": "refinement/decklists/Edea_Possessed_Sorceress_Approved_2026-10-14.txt"
          }
          state_path.write_text(json.dumps(state, indent=2) + "\n")

          tracker_path = Path("refinement/Deck_Refinement_Tracker_2026-10-12.csv")
          with tracker_path.open(newline="", encoding="utf-8") as f:
              reader = csv.DictReader(f)
              rows = list(reader)
              fieldnames = reader.fieldnames
          if not fieldnames:
              raise SystemExit("tracker has no header")

          found = False
          for row in rows:
              if row.get("deck_id") != "Edea__Possessed_Sorceress":
                  continue
              found = True
              row["baseline_status"] = "CURRENT APPROVED FINAL LIST — current-cycle canonical list locked; frozen source exports preserved unchanged."
              row["fresh_oracle_identity_check"] = "PASS — fresh current-cycle Oracle cache generated 2026-10-14; exact SHA-bound Edea candidate verified in Grixis color identity with zero unresolved metadata."
              row["fresh_official_legality_check"] = "PASS — exact SHA-bound Edea candidate verified against current official Commander legality on 2026-10-14; no project exception required."
              row["official_named_ban_list_checkpoint"] = "PASS — current official Commander legality checkpoint completed 2026-10-14; no unexpected banned cards and no project exception required."
              row["commander_blueprint_complete"] = "PASS — current-cycle commander-first blueprint and mandatory 99-slot whole-list audit completed 2026-10-14."
              row["high_impact_candidate_triage_complete"] = "PASS — project top-100 candidates, stale-audit alternatives, current commander evidence, and adversarial challengers exhausted; second serious pass produced ZERO NEW MATERIAL IMPROVEMENTS."
              row["swap_decision_ledger_complete"] = "PASS — exact nine-swap approval candidate explicitly approved by user on 2026-10-14."
              row["combo_rules_interactions_verified"] = "PASS — SHA-bound rules attestation covers Edea targeting/death triggers, Thassa retention, trigger copies/clones, extra combats, sacrifice ordering, and relevant theft interactions."
              row["consistency_test_complete"] = "PASS — exact approved artifact verified at 100 cards / 94 distinct names / 35 lands; only Island, Mountain, and Swamp repeat; candidate and approved artifact byte-match SHA."
              row["multiplayer_test_complete_or_reason_not_applicable"] = "NOT APPLICABLE AS A FINALIZATION GATE — commander-first structural, rules, legality, and strategic verification passed; no gameplay win-rate claim is made."
              row["final_gate_passed"] = "YES"
              row["final_list_hash"] = expected_sha
              row["user_approval_date"] = "2026-10-14"
              row["refinement_status"] = "APPROVED / LOCKED — current global-restart-2026-10-13 cycle"
              prior = row.get("notes", "")
              addition = (
                  " CURRENT-CYCLE RECONCILIATION 2026-10-14: exact SHA-bound Edea approval candidate explicitly approved and locked. "
                  "Canonical hash: fd560a9b0777088b3ad1684ded030566c894faa206ddf6763b74d95d82c532e4. "
                  "Approved swaps: Garland, Royal Kidnapper -> Thassa, Deep-Dwelling; The Beast, Deathless Prince -> Mass Mutiny; "
                  "Coercive Recruiter -> Captivating Crew; Morbid Opportunist -> Strionic Resonator; Dictate of Erebos -> Full Throttle; "
                  "Reliquary Tower -> Arcane Lighthouse; Dragonskull Summit -> City of Brass; Drowned Catacomb -> Mana Confluence; "
                  "Sulfur Falls -> Ancient Tomb. Mandatory whole-list audit, candidate exhaustion, red-team review, zero-new-material-improvement closure, "
                  "fresh Oracle/rules/legality checks, and complete fail-closed gate all PASS. Frozen source exports remain historical baseline evidence. "
                  "Next unlocked deck in tracker order: Edward Kenway."
              )
              row["notes"] = prior + addition
              break

          if not found:
              raise SystemExit("Edea tracker row not found")

          with tracker_path.open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames, lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          PY

          git add state/current_deck_overrides.json refinement/Deck_Refinement_Tracker_2026-10-12.csv
          if git diff --cached --quiet; then
            echo "No state/tracker changes to commit."
            exit 0
          fi
          git commit -m "Lock approved Edea deck in current cycle"
          git push origin HEAD:main
