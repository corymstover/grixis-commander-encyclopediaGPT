name: Project quality gates and frozen baseline verification

on:
  push:
    branches: ["main", "baseline/**", "refinement/**", "automation/**"]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-scryfall.txt"
      - "source-package/GrixisFINAL_62Decks_CSV_TXT_2026-10-12.tar.gz"
      - "source-package/Grixis_Independent_Deck_Hash_Manifest_2026-10-12.csv"
      - "refinement/Deck_Refinement_Tracker_2026-10-12.csv"
      - "refinement/metadata_audit/REFRESH_REQUEST*.md"
  pull_request:
    branches: ["main", "baseline/**"]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-scryfall.txt"
      - "source-package/GrixisFINAL_62Decks_CSV_TXT_2026-10-12.tar.gz"
      - "source-package/Grixis_Independent_Deck_Hash_Manifest_2026-10-12.csv"
      - "refinement/Deck_Refinement_Tracker_2026-10-12.csv"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scryfall.txt
      - name: Install refresh/test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-scryfall.txt
      - name: Run repository unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check refresh trigger/path contracts
        run: python scripts/check_workflow_contracts.py
      - name: Verify refinement tracker schema and approval metadata
        run: python scripts/check_tracker_integrity.py
      - name: Verify frozen 62-deck source package
        run: python scripts/verify_baseline.py
