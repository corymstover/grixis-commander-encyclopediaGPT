name: Verify Evelyn the Covetous complete approval gate

on:
  push:
    branches: ["main", "refinement/**", "automation/**"]
    paths:
      - "scripts/verify_complete_approval_gate.py"
      - ".github/workflows/verify-evelyn-the-covetous-complete-gate.yml"
      - "refinement/decklists/Evelyn_the_Covetous_Current_Cycle_Baseline_2026-10-14.txt"
      - "refinement/decklists/Evelyn_the_Covetous_Approval_Candidate_2026-10-14.txt"
      - "refinement/verification/evelyn_the_covetous_2026-10-14/Evelyn_the_Covetous_Rules_Attestation.json"
      - "refinement/verification/evelyn_the_covetous_2026-10-14/Evelyn_the_Covetous_Official_Legality_Attestation.json"
      - "refinement/verification/evelyn_the_covetous_2026-10-14/Evelyn_the_Covetous_Complete_Gate_Config.json"
      - "refinement/metadata_audit/Current_Cycle_Oracle_Cache.jsonl"
      - "refinement/metadata_audit/Current_Cycle_Oracle_Cache_Summary.json"
      - "source-package/research/Project_Exceptions_Current_2026-10-12.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evelyn-the-covetous-complete-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run complete fail-closed approval gate
        run: >-
          python scripts/verify_complete_approval_gate.py
          --config refinement/verification/evelyn_the_covetous_2026-10-14/Evelyn_the_Covetous_Complete_Gate_Config.json

      - name: Commit successful gate evidence
        if: success()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "$BRANCH_NAME"
          git add refinement/verification/evelyn_the_covetous_2026-10-14/gate_output/
          if git diff --cached --quiet; then
            echo "No Evelyn gate evidence changes to commit."
            exit 0
          fi
          git commit -m "Persist Evelyn the Covetous complete approval gate [skip ci]"
          git push origin "HEAD:$BRANCH_NAME"

      - name: Preserve gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evelyn-the-covetous-complete-gate-${{ github.run_id }}
          path: refinement/verification/evelyn_the_covetous_2026-10-14/gate_output/
          if-no-files-found: warn
          retention-days: 90
