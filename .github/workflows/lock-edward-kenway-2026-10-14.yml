name: Lock approved Edward Kenway deck

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/lock-edward-kenway-2026-10-14.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify approval and lock Edward Kenway
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv, hashlib, io, json

          root = Path('.')
          expected_sha = 'a08d3bc9c283415f1579c493eccb3febd7d10dea3777bf3dc50cfbc0dbed4019'
          candidate = root / 'refinement/decklists/Edward_Kenway_Approval_Candidate_2026-10-14.txt'
          approved = root / 'refinement/decklists/Edward_Kenway_Approved_2026-10-14.txt'
          gate_path = root / 'refinement/verification/edward_kenway_2026-10-14/gate_output/Edward_Kenway_2026-10-14_Complete_Gate.json'
          state_path = root / 'state/current_deck_overrides.json'
          tracker_path = root / 'refinement/Deck_Refinement_Tracker_2026-10-12.csv'
          approval_record = root / 'refinement/approvals/Edward_Kenway_Approved_2026-10-14.md'

          data = candidate.read_bytes()
          actual_sha = hashlib.sha256(data).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f'candidate SHA mismatch: {actual_sha}')

          gate = json.loads(gate_path.read_text(encoding='utf-8'))
          if gate.get('overall_result') != 'APPROVAL_READY':
              raise SystemExit(f"gate is not APPROVAL_READY: {gate.get('overall_result')}")
          if gate.get('deck_sha256') != expected_sha:
              raise SystemExit('gate SHA does not match approved candidate')
          if gate.get('count') != 100 or gate.get('errors'):
              raise SystemExit('gate structural/error check failed')
          if gate.get('rules_gate') != 'PASS' or gate.get('official_legality_gate') != 'PASS':
              raise SystemExit('rules or legality gate is not PASS')
          if gate.get('project_exceptions'):
              raise SystemExit('unexpected project exception present')

          approved.write_bytes(data)
          if hashlib.sha256(approved.read_bytes()).hexdigest() != expected_sha:
              raise SystemExit('approved artifact byte-copy hash mismatch')

          state = json.loads(state_path.read_text(encoding='utf-8'))
          if state.get('cycle_id') != 'global-restart-2026-10-13':
              raise SystemExit('unexpected refinement cycle')
          decks = state.setdefault('decks', {})
          decks['Edward_Kenway'] = {
              'approval_status': 'APPROVED',
              'lock_status': 'LOCKED',
              'final_gate_passed': True,
              'user_approval_date': '2026-10-14',
              'current_stage': 'LOCKED',
              'approved_list_sha256': expected_sha,
              'quality_gate_version': 'Deck Quality Gates v3 + mandatory whole-list audit',
              'approval_basis': 'Explicit user approval of the exact SHA-bound Edward Kenway approval candidate after mandatory 99-slot whole-list audit, candidate exhaustion, adversarial red-team review, zero-new-material-improvement closure, fresh Oracle/rules verification, current official Commander legality verification, and complete fail-closed gate APPROVAL_READY with zero errors.',
              'complete_gate_artifact': 'refinement/verification/edward_kenway_2026-10-14/gate_output/Edward_Kenway_2026-10-14_Complete_Gate.json',
              'whole_list_audit_artifact': 'refinement/decisions/Edward_Kenway_Current_Cycle_Decisions_2026-10-14.md',
              'approved_list_artifact': 'refinement/decklists/Edward_Kenway_Approved_2026-10-14.txt'
          }
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=True) + '\n', encoding='utf-8')

          raw_lines = tracker_path.read_text(encoding='utf-8-sig').splitlines(keepends=True)
          header = next(csv.reader([raw_lines[0].rstrip('\r\n')]))
          found = False
          for i in range(1, len(raw_lines)):
              parsed = next(csv.reader([raw_lines[i].rstrip('\r\n')]))
              if len(parsed) < 2 or parsed[1] != 'Edward_Kenway':
                  continue
              row = dict(zip(header, parsed))
              row.update({
                  'baseline_status': 'CURRENT APPROVED FINAL LIST — current-cycle canonical list locked; frozen source exports preserved unchanged.',
                  'fresh_oracle_identity_check': 'PASS — fresh current-cycle Oracle cache generated 2026-10-14; exact SHA-bound Edward candidate verified in Grixis color identity with zero unresolved metadata.',
                  'fresh_official_legality_check': 'PASS — exact SHA-bound Edward candidate verified against current official Commander legality on 2026-10-14; no project exception required.',
                  'official_named_ban_list_checkpoint': 'PASS — current official Commander legality checkpoint completed 2026-10-14; no unexpected banned cards and no project exception required.',
                  'commander_blueprint_complete': 'PASS — current-cycle commander-first blueprint and mandatory 99-slot whole-list audit completed 2026-10-14.',
                  'high_impact_candidate_triage_complete': 'PASS — project top-100 candidates, stale-audit alternatives, current commander evidence, and outside challengers exhausted; second serious pass produced ZERO NEW MATERIAL IMPROVEMENTS.',
                  'swap_decision_ledger_complete': 'PASS — exact four-swap approval candidate explicitly approved by user on 2026-10-14.',
                  'combo_rules_interactions_verified': 'PASS — SHA-bound rules attestation covers Edward subtype count-once, play-versus-cast permissions, Luxurious Locomotive over-crewing with Time Sieve, Malcolm plus Glint-Horn Buccaneer, Reaver Cleaver plus Time Sieve, Roaming Throne, Academy Manufactor/Fateful Discovery, and RMS Titanic timing.',
                  'consistency_test_complete': 'PASS — exact approved artifact verified at 100 cards / 98 distinct names / 35 lands; only Island and Swamp repeat; candidate and approved artifact byte-match SHA.',
                  'multiplayer_test_complete_or_reason_not_applicable': 'NOT APPLICABLE AS A FINALIZATION GATE — commander-first structural, rules, legality, and strategic verification passed; no gameplay win-rate claim is made.',
                  'final_gate_passed': 'YES',
                  'final_list_hash': expected_sha,
                  'user_approval_date': '2026-10-14',
                  'refinement_status': 'APPROVED / LOCKED — current global-restart-2026-10-13 cycle',
                  'notes': "Prior FINAL approval/status is preserved; do not overwrite without explicit change log. GLOBAL UNLOCK AUTHORIZATION 2026-10-13: user explicitly unlocked all previously locked decks and authorized reopening any previously approved deck. The current NOT STARTED state refers only to the newer refinement cycle and is not a restriction. Preserve existing/frozen source exports; use current final list as baseline and make only verified commander-first changes. Prior approvals remain historical records, not a prohibition on revision. CURRENT-CYCLE RECONCILIATION 2026-10-14: exact SHA-bound Edward Kenway approval candidate explicitly approved and locked. Canonical hash: a08d3bc9c283415f1579c493eccb3febd7d10dea3777bf3dc50cfbc0dbed4019. Approved swaps: Setzer, Wandering Gambler -> Ramirez DePietro, Pillager; Mechanized Production -> Glint-Horn Buccaneer; Revel in Riches -> Luxurious Locomotive; Sulfur Falls -> Underground River. Mandatory whole-list audit, candidate exhaustion, red-team review, zero-new-material-improvement closure, fresh Oracle/rules/legality checks, and complete fail-closed gate all PASS. Frozen source exports remain historical baseline evidence. Next unlocked deck in tracker order: Evelyn, the Covetous."
              })
              out = io.StringIO()
              w = csv.writer(out, lineterminator='\n')
              w.writerow([row.get(k, '') for k in header])
              raw_lines[i] = out.getvalue()
              found = True
              break
          if not found:
              raise SystemExit('Edward tracker row not found')
          tracker_path.write_text(''.join(raw_lines), encoding='utf-8')

          approval_record.parent.mkdir(parents=True, exist_ok=True)
          approval_record.write_text(f'''# Edward Kenway — Current-Cycle Approval Record

**Date:** 2026-10-14  
**Cycle:** `global-restart-2026-10-13`  
**Deck:** #17 — Edward Kenway  
**Status:** **APPROVED / LOCKED**  
**Canonical approved SHA-256:** `{expected_sha}`

## Explicit approval

The user explicitly approved the exact SHA-bound approval candidate on 2026-10-14. No further card changes are authorized after this approval without an explicit reopen request.

## Approved changes

1. `Setzer, Wandering Gambler` -> `Ramirez DePietro, Pillager`
2. `Mechanized Production` -> `Glint-Horn Buccaneer`
3. `Revel in Riches` -> `Luxurious Locomotive`
4. `Sulfur Falls` -> `Underground River`

## Verification basis

The approved list is the exact candidate that completed the mandatory 99-slot whole-list audit, commander-specific candidate exhaustion, adversarial red-team review, second serious pass with **ZERO NEW MATERIAL IMPROVEMENTS**, fresh Oracle/rules verification, current official Commander legality verification, and the complete fail-closed approval gate.

Complete gate result:
- Total cards: **100**
- Distinct names: **98**
- Repeated names: basic lands only (`Island`, `Swamp`)
- Land count: **35**
- Commander color identity: **B/R/U — PASS**
- Singleton compliance: **PASS**
- Rules gate: **PASS**
- Official Commander legality: **PASS**
- Project exceptions: **none**
- Errors: **0**
- Gate result before user approval: **APPROVAL_READY**

## Canonical artifacts

- Approved list: `refinement/decklists/Edward_Kenway_Approved_2026-10-14.txt`
- Approval candidate: `refinement/decklists/Edward_Kenway_Approval_Candidate_2026-10-14.txt`
- Whole-list / decision record: `refinement/decisions/Edward_Kenway_Current_Cycle_Decisions_2026-10-14.md`
- Complete gate: `refinement/verification/edward_kenway_2026-10-14/gate_output/Edward_Kenway_2026-10-14_Complete_Gate.json`

The frozen source-package CSV/TXT exports remain preserved as historical baseline evidence. The current-cycle approved artifact above is now canonical.
''', encoding='utf-8')
          PY

      - name: Commit Edward lock state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add \
            refinement/decklists/Edward_Kenway_Approved_2026-10-14.txt \
            refinement/approvals/Edward_Kenway_Approved_2026-10-14.md \
            state/current_deck_overrides.json \
            refinement/Deck_Refinement_Tracker_2026-10-12.csv
          git diff --cached --check
          git commit -m "Lock approved Edward Kenway deck in current cycle"
          git push origin HEAD:main
