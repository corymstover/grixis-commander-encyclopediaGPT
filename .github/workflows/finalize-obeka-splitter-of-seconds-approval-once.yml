name: Finalize Obeka Splitter of Seconds approval once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/finalize-obeka-splitter-of-seconds-approval-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconcile SHA and finalize exact approved Obeka Splitter candidate
        run: python scripts/reconcile_and_finalize_obeka_splitter_sha.py

      - name: Commit finalized approval state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/current_deck_overrides.json \
                  refinement/Deck_Refinement_Tracker_2026-10-12.csv \
                  refinement/decklists/Obeka_Splitter_of_Seconds_Approved_2026-10-15.txt \
                  refinement/approvals/Obeka_Splitter_of_Seconds_Approved_2026-10-15.md \
                  refinement/decisions/Obeka_Splitter_of_Seconds_Candidate_Decisions_2026-10-15.md \
                  refinement/verification/Obeka_Splitter_of_Seconds_Whole_List_Audit_2026-10-15.md \
                  refinement/verification/Obeka_Splitter_of_Seconds_Approval_Ready_Verification_2026-10-15.md \
                  refinement/blueprints/Obeka_Splitter_of_Seconds_Commander_Blueprint_2026-10-15.md
          git commit -m "Approve and lock Obeka Splitter of Seconds after SHA reconciliation [skip ci]"
          git push origin HEAD:main
