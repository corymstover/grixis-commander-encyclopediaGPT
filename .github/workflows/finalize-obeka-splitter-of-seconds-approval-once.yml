name: Finalize Tetsuo Imperial Champion approval once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/finalize-obeka-splitter-of-seconds-approval-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Finalize exact approved Tetsuo Imperial Champion candidate
        run: python scripts/finalize_tetsuo_imperial_champion_approval_once.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Approve and lock Tetsuo Imperial Champion [skip ci]"
          file_pattern: "state/current_deck_overrides.json refinement/Deck_Refinement_Tracker_2026-10-12.csv refinement/decklists/Tetsuo_Imperial_Champion_Approved_2026-10-15.txt refinement/approvals/Tetsuo_Imperial_Champion_Approved_2026-10-15.md refinement/decisions/Tetsuo_Imperial_Champion_Candidate_Decisions_2026-10-15.md"
