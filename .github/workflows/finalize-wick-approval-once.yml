name: Build final Archidekt export package

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/finalize-wick-approval-once.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build verified 62-deck Archidekt package
        run: python scripts/build_archidekt_export_package_final.py
      - name: Commit export package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/archidekt_2026-10-15 exports/Grixis_Commander_Encyclopedia_62_Archidekt_2026-10-15.zip
          git commit -m "Add verified 62-deck Archidekt import package"
          git push origin HEAD:main
      - name: Upload downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: Grixis_Commander_Encyclopedia_62_Archidekt_2026-10-15
          path: exports/Grixis_Commander_Encyclopedia_62_Archidekt_2026-10-15.zip
          if-no-files-found: error
          retention-days: 30
