name: Finalize Zevlor approval once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/finalize-wick-approval-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile exact approved Zevlor candidate
        run: python scripts/finalize_zevlor_approval_once.py
      - name: Commit reconciled approval state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/current_deck_overrides.json \
                  refinement/Deck_Refinement_Tracker_2026-10-12.csv \
                  refinement/decklists/Zevlor_Elturel_Exile_Approved_2026-10-15.txt \
                  refinement/approvals/Zevlor_Elturel_Exile_Approved_2026-10-15.md
          git commit -m "Approve and lock Zevlor in current state"
          git push origin HEAD:main
