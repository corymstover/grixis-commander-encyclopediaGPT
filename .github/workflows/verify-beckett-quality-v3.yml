name: Verify Admiral Beckett Brass Deck Quality Gates v3
on:
  push:
    branches: ["refinement/admiral-beckett-brass-v3-2026-10-13"]
    paths:
      - "refinement/evidence/Admiral_Beckett_Brass_Deck_Quality_v3.json"
      - "refinement/verification/Admiral_Beckett_Brass_v3_Review_2026-10-13.md"
      - "refinement/decklists/Admiral_Beckett_Brass_v3_Proposed_2026-10-13.txt"
      - "grixis_pipeline/**"
      - "scripts/evaluate_deck_quality_packet.py"
  pull_request:
    paths:
      - "refinement/evidence/Admiral_Beckett_Brass_Deck_Quality_v3.json"
      - "refinement/verification/Admiral_Beckett_Brass_v3_Review_2026-10-13.md"
      - "refinement/decklists/Admiral_Beckett_Brass_v3_Proposed_2026-10-13.txt"
      - "grixis_pipeline/**"
      - "scripts/evaluate_deck_quality_packet.py"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Evaluate Beckett v3 evidence packet
        run: PYTHONPATH=. python scripts/evaluate_deck_quality_packet.py refinement/evidence/Admiral_Beckett_Brass_Deck_Quality_v3.json --output /tmp/beckett-v3-report.json
      - name: Run deck quality regression tests
        run: python -m unittest tests.test_epistemic_gates tests.test_generic_runner tests.test_dependency_invalidation -v
      - name: Verify frozen baseline
        run: python scripts/verify_baseline.py
