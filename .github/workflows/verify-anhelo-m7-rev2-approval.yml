name: Verify Anhelo M7 Rev2 Approval

on:
  pull_request:
    paths:
      - "refinement/decklists/Anhelo_the_Painter_M7_Rev2_Approved_2026-10-23.txt"
      - "refinement/approvals/Anhelo_the_Painter_M7_Rev2_Approved_2026-10-23.md"
      - "refinement/verification/Anhelo_the_Painter_M7_Rev2_Approved_2026-10-23_Verification.md"
      - "state/current_deck_overrides.json"
      - "refinement/Deck_Refinement_Tracker_2026-10-12.csv"
      - "tests/test_anhelo_rev2_m7_approval.py"
      - ".github/workflows/verify-anhelo-m7-rev2-approval.yml"
  push:
    branches: ["main"]
    paths:
      - "refinement/decklists/Anhelo_the_Painter_M7_Rev2_Approved_2026-10-23.txt"
permissions:
  contents: read
jobs:
  exact-approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify owner-approved exact Anhelo 100, prior approved source and authority
        run: python -m unittest discover -s tests -p 'test_anhelo_rev2_m7_approval.py' -v
      - name: Verify prior three exact M7 locks
        run: |
          python -m unittest discover -s tests -p 'test_abaddon_rev3_m7_approval.py' -v
          python -m unittest discover -s tests -p 'test_admiral_m7_approval.py' -v
          python -m unittest discover -s tests -p 'test_admiral_brass_unsinkable_rev3_approval.py' -v
