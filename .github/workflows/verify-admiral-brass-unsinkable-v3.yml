name: Verify Admiral Brass Unsinkable Deck Quality Gates v3
on:
  push:
    branches: ["refinement/brass-unsinkable-v3"]
  pull_request:
    paths:
      - "refinement/evidence/Admiral_Brass_Unsinkable_Deck_Quality_v3.json"
      - "refinement/verification/Admiral_Brass_Unsinkable_v3_Review_2026-10-13.md"
      - "refinement/decklists/Admiral_Brass_Unsinkable_Proposed_Final_2026-10-13.txt"
      - "scripts/verify_admiral_brass_unsinkable_v3.py"
      - "grixis_pipeline/**"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify exact proposed list
        run: python scripts/verify_admiral_brass_unsinkable_v3.py
      - name: Evaluate v3 evidence packet
        run: PYTHONPATH=. python scripts/evaluate_deck_quality_packet.py refinement/evidence/Admiral_Brass_Unsinkable_Deck_Quality_v3.json
      - name: Run v3 regressions
        run: python -m unittest tests.test_epistemic_gates tests.test_generic_runner tests.test_dependency_invalidation -v
      - name: Verify frozen source package
        run: python scripts/verify_baseline.py
