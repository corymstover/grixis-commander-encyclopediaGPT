name: Finalize Garza Zol approval once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/finalize-garza-zol-approval-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and finalize exact approved Garza candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          from pathlib import Path

          EXPECTED_SHA = "32c0e8049a9c8a5d238048b4f774f0457908d724f23d4597b7da93a6cba0c16f"
          CYCLE = "global-restart-2026-10-13"
          DATE = "2026-10-14"
          deck_id = "Garza_Zol__Plague_Queen"

          candidate = Path("refinement/decklists/Garza_Zol_Plague_Queen_Approval_Candidate_2026-10-14.txt")
          approved = Path("refinement/decklists/Garza_Zol_Plague_Queen_Approved_2026-10-14.txt")
          gate_path = Path("refinement/verification/garza_zol_plague_queen_2026-10-14/gate_output/Garza_Zol_Plague_Queen_2026-10-14_Complete_Gate.json")
          state_path = Path("state/current_deck_overrides.json")
          tracker_path = Path("refinement/Deck_Refinement_Tracker_2026-10-12.csv")
          approval_record = Path("refinement/approvals/Garza_Zol_Plague_Queen_Approved_2026-10-14.md")

          raw = candidate.read_bytes()
          actual_sha = hashlib.sha256(raw).hexdigest()
          if actual_sha != EXPECTED_SHA:
              raise SystemExit(f"Garza candidate SHA mismatch: {actual_sha}")

          gate = json.loads(gate_path.read_text(encoding="utf-8"))
          if gate.get("deck_sha256") != EXPECTED_SHA:
              raise SystemExit("Complete gate is not bound to the approved Garza SHA")
          if gate.get("overall_result") != "APPROVAL_READY" or gate.get("errors"):
              raise SystemExit("Garza complete gate is not clean APPROVAL_READY")
          if gate.get("count") != 100 or gate.get("distinct_names") != 100:
              raise SystemExit("Garza structural gate no longer reports 100 / 100")
          if sorted(gate.get("commander_color_identity", [])) != ["B", "R", "U"]:
              raise SystemExit("Garza color identity gate mismatch")
          if gate.get("rules_gate") != "PASS" or gate.get("official_legality_gate") != "PASS":
              raise SystemExit("Garza rules or legality gate is not PASS")
          if gate.get("project_exceptions"):
              raise SystemExit("Unexpected Garza project exception")

          approved.write_bytes(raw)
          if hashlib.sha256(approved.read_bytes()).hexdigest() != EXPECTED_SHA:
              raise SystemExit("Approved Garza artifact failed byte-match check")

          state = json.loads(state_path.read_text(encoding="utf-8"))
          if state.get("cycle_id") != CYCLE:
              raise SystemExit("Wrong current refinement cycle")
          state.setdefault("decks", {})[deck_id] = {
              "approval_status": "APPROVED",
              "lock_status": "LOCKED",
              "final_gate_passed": True,
              "user_approval_date": DATE,
              "current_stage": "LOCKED",
              "approved_list_sha256": EXPECTED_SHA,
              "quality_gate_version": "Deck Quality Gates v3 + mandatory whole-list audit + Complete Approval Gate v1",
              "approval_basis": "Explicit user approval of the exact SHA-bound Garza Zol, Plague Queen approval candidate after mandatory 99-slot whole-list audit, candidate exhaustion, adversarial red-team review, zero-new-material-improvement closure, fresh Oracle/color-identity verification, current official Commander legality verification, independent rules verification, and complete fail-closed gate APPROVAL_READY with zero errors.",
              "complete_gate_artifact": "refinement/verification/garza_zol_plague_queen_2026-10-14/gate_output/Garza_Zol_Plague_Queen_2026-10-14_Complete_Gate.json",
              "whole_list_audit_artifact": "refinement/decisions/Garza_Zol_Plague_Queen_Current_Cycle_Decisions_2026-10-14.md",
              "approval_record_artifact": "refinement/approvals/Garza_Zol_Plague_Queen_Approved_2026-10-14.md",
              "approved_list_artifact": "refinement/decklists/Garza_Zol_Plague_Queen_Approved_2026-10-14.txt"
          }
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          approval_record.parent.mkdir(parents=True, exist_ok=True)
          approval_record.write_text(f"""# Garza Zol, Plague Queen — APPROVED / LOCKED

Cycle: `{CYCLE}`  
Approval date: {DATE}  
Approved SHA-256: `{EXPECTED_SHA}`  
Power Bracket: **4 — Optimized**  
Archidekt tags: **Voltron / Commander Damage / Deathtouch-Control**

## Approval basis

The user explicitly approved the exact SHA-bound approval candidate after the complete fail-closed gate returned `APPROVAL_READY` with zero errors.

Verification state:
- 100 cards
- 100 distinct names
- Commander color identity: B/R/U
- Rules gate: PASS
- Official Commander legality gate: PASS
- Project exceptions: none
- Fresh Oracle cache: PASS
- Mandatory whole-list audit: complete
- Candidate exhaustion / adversarial red-team review: complete
- Zero-new-material-improvement closure: complete

Canonical approved artifact: `refinement/decklists/Garza_Zol_Plague_Queen_Approved_2026-10-14.txt`

Complete gate artifact: `refinement/verification/garza_zol_plague_queen_2026-10-14/gate_output/Garza_Zol_Plague_Queen_2026-10-14_Complete_Gate.json`

This deck is now locked. Do not revise, reopen, or replace it unless the user explicitly requests that action.
""", encoding="utf-8")

          # Update only the target tracker rows while preserving every untouched raw CSV row.
          raw_lines = tracker_path.read_text(encoding="utf-8").splitlines()
          header = next(csv.reader([raw_lines[0]]))
          idx = {name: i for i, name in enumerate(header)}

          def update_line(line, updates):
              row = next(csv.reader([line]))
              if len(row) < len(header):
                  row += [""] * (len(header) - len(row))
              for k, v in updates.items():
                  row[idx[k]] = v
              out = io.StringIO()
              w = csv.writer(out, lineterminator="")
              w.writerow(row)
              return out.getvalue()

          garza_updates = {
              "baseline_status": "CURRENT APPROVED FINAL LIST — current-cycle canonical list locked; frozen source exports preserved unchanged.",
              "fresh_oracle_identity_check": "PASS — fresh current-cycle Oracle cache generated 2026-10-14; exact SHA-bound Garza candidate verified at 100 cards / 100 distinct names within B/R/U color identity with zero unresolved metadata.",
              "fresh_official_legality_check": "PASS — exact SHA-bound Garza candidate verified against current official Commander legality on 2026-10-14; no project exception required.",
              "official_named_ban_list_checkpoint": "PASS — current official Commander legality checkpoint completed 2026-10-14; no unexpected banned cards and no project exception required.",
              "commander_blueprint_complete": "PASS — current-cycle commander-first Voltron/control blueprint and mandatory 99-slot whole-list audit completed 2026-10-14.",
              "high_impact_candidate_triage_complete": "PASS — project top-100 candidates, current commander evidence, stale-audit alternatives, mana-base challengers, and adversarial alternatives exhausted; second serious pass produced ZERO NEW MATERIAL IMPROVEMENTS.",
              "swap_decision_ledger_complete": "PASS — exact SHA-bound Garza approval candidate explicitly approved by user on 2026-10-14.",
              "combo_rules_interactions_verified": "PASS — SHA-bound rules attestation covers Thornbite/deathtouch removal, Garza-sourced mass damage, Scythe of the Wretched, Blade of the Bloodchief, Hatred commander damage, infect/double-strike/triple-damage thresholds, Sword of Feast and Famine plus Aggravated Assault, Robe of the Archmagi, Kediss damage classification, The Ozolith, phasing, and Command Beacon.",
              "consistency_test_complete": "PASS — exact approved artifact verified at 100 cards / 100 distinct names / 38 lands; candidate and approved artifact byte-match SHA.",
              "multiplayer_test_complete_or_reason_not_applicable": "NOT APPLICABLE AS A FINALIZATION GATE — commander-first structural, rules, legality, and strategic verification passed; no gameplay win-rate claim is made.",
              "final_gate_passed": "YES",
              "final_list_hash": EXPECTED_SHA,
              "user_approval_date": DATE,
              "refinement_status": f"APPROVED / LOCKED — current {CYCLE} cycle",
              "notes": f"CURRENT-CYCLE RECONCILIATION {DATE}: exact SHA-bound Garza Zol, Plague Queen approval candidate explicitly approved and locked. Canonical hash: {EXPECTED_SHA}. Final candidate: 100 cards, 100 distinct names, 38 lands; B/R/U identity PASS; rules PASS; current official Commander legality PASS; no project exceptions; complete gate errors 0. Natural ceiling: Bracket 4 — Optimized. Commander-first Voltron / Commander Damage / Deathtouch-Control identity preserved. Mandatory 99-slot whole-list audit, candidate exhaustion, adversarial red-team review, zero-new-material-improvement closure, fresh Oracle/rules/legality checks, and complete fail-closed gate all PASS. Frozen source exports remain historical baseline evidence. Next unlocked deck in tracker order: Goro-Goro and Satoru."
          }

          # Administrative reconciliation only: Azula is already authoritative APPROVED/LOCKED in current_deck_overrides,
          # but its tracker row was stale. No Azula decklist bytes are changed here.
          azula_hash = "b6ef396641f2b5cfac0eb81fb494f21f3745e2a3fd47fa75d2eaadbdc34ddee5"
          azula_updates = {
              "baseline_status": "CURRENT APPROVED FINAL LIST — current-cycle canonical list locked; frozen source exports preserved unchanged.",
              "fresh_oracle_identity_check": "PASS — fresh current-cycle Oracle verification completed 2026-10-14; exact SHA-bound Azula candidate verified at 100 cards / 100 distinct names within B/R/U color identity with zero unresolved metadata.",
              "fresh_official_legality_check": "PASS — exact SHA-bound Azula candidate verified against current official Commander legality on 2026-10-14; no project exception required.",
              "official_named_ban_list_checkpoint": "PASS — current official Commander legality checkpoint completed 2026-10-14; no unexpected banned cards and no project exception required.",
              "commander_blueprint_complete": "PASS — current-cycle commander-first cEDH blueprint and mandatory 99-slot whole-list audit completed 2026-10-14.",
              "high_impact_candidate_triage_complete": "PASS — candidate exhaustion, adversarial red-team review, and zero-new-material-improvement closure completed at the established cEDH natural ceiling.",
              "swap_decision_ledger_complete": "PASS — exact SHA-bound Fire Lord Azula approval candidate explicitly approved by user on 2026-10-14.",
              "combo_rules_interactions_verified": "PASS — exact SHA-bound independent rules verification completed as part of the persisted complete approval gate and attestation artifacts.",
              "consistency_test_complete": "PASS — complete gate verified the exact Azula candidate at 100 cards / 100 distinct names with B/R/U identity and zero errors.",
              "multiplayer_test_complete_or_reason_not_applicable": "NOT APPLICABLE AS A FINALIZATION GATE — structural, rules, legality, strategic, and cEDH evidence verification passed; no gameplay win-rate claim is made.",
              "final_gate_passed": "YES",
              "final_list_hash": azula_hash,
              "user_approval_date": DATE,
              "refinement_status": f"APPROVED / LOCKED — current {CYCLE} cycle",
              "notes": f"TRACKER STATUS RECONCILIATION {DATE}: authoritative state/current_deck_overrides.json already records Fire Lord Azula APPROVED and LOCKED after explicit user approval. Canonical hash: {azula_hash}. Persisted complete gate reports 100 cards, 100 distinct names, B/R/U identity PASS, rules PASS, current official Commander legality PASS, no project exceptions, and zero errors. This reconciliation changes tracker metadata only; the approved Azula decklist is not reopened or modified."
          }

          found = {"garza": False, "azula": False}
          for n in range(1, len(raw_lines)):
              row = next(csv.reader([raw_lines[n]]))
              if len(row) <= idx["deck_id"]:
                  continue
              if row[idx["deck_id"]] == deck_id:
                  raw_lines[n] = update_line(raw_lines[n], garza_updates)
                  found["garza"] = True
              elif row[idx["deck_id"]] == "Fire_Lord_Azula":
                  raw_lines[n] = update_line(raw_lines[n], azula_updates)
                  found["azula"] = True
          if not all(found.values()):
              raise SystemExit(f"Tracker target row missing: {found}")
          tracker_path.write_text("\n".join(raw_lines) + "\n", encoding="utf-8")

          # Final state assertions.
          reread = json.loads(state_path.read_text(encoding="utf-8"))["decks"][deck_id]
          assert reread["approval_status"] == "APPROVED"
          assert reread["lock_status"] == "LOCKED"
          assert reread["approved_list_sha256"] == EXPECTED_SHA
          print("Garza approval finalized; Azula tracker status reconciled.")
          PY

      - name: Commit finalized approval state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/current_deck_overrides.json \
                  refinement/Deck_Refinement_Tracker_2026-10-12.csv \
                  refinement/decklists/Garza_Zol_Plague_Queen_Approved_2026-10-14.txt \
                  refinement/approvals/Garza_Zol_Plague_Queen_Approved_2026-10-14.md
          git commit -m "Approve and lock Garza Zol Plague Queen"
          git push origin HEAD:main
