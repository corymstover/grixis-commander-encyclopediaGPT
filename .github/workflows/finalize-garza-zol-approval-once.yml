name: Finalize Garza Zol approval once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/finalize-garza-zol-approval-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Finalize exact approved Garza candidate
        run: python scripts/finalize_garza_approval_once.py

      - name: Commit finalized approval state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/current_deck_overrides.json \
                  refinement/Deck_Refinement_Tracker_2026-10-12.csv \
                  refinement/decklists/Garza_Zol_Plague_Queen_Approved_2026-10-14.txt \
                  refinement/approvals/Garza_Zol_Plague_Queen_Approved_2026-10-14.md
          git commit -m "Approve and lock Garza Zol Plague Queen"
          git push origin HEAD:main
