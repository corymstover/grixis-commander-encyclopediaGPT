name: M8 original P1 exact-current bounded mechanics batch C

on:
  pull_request:
    paths:
      - 'tests/test_m8_original_p1_batch_c_bounded.py'
      - 'architecture/M8_ORIGINAL_P1_BATCH_C_BOUNDARIES.md'
      - '.github/workflows/verify-m8-original-p1-batch-c.yml'
      - 'refinement/verification/m8_current_release_evidence_v1.json'
  push:
    branches: [main]
    paths:
      - 'tests/test_m8_original_p1_batch_c_bounded.py'
      - 'refinement/verification/m8_current_release_evidence_v1.json'
  workflow_dispatch:

jobs:
  exact-current-original-p1:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 17 exact-current original P1 finite positive/adversarial witnesses
        run: python -m unittest discover -s tests -p test_m8_original_p1_batch_c_bounded.py -v
      - name: Re-run current M8 fail-closed certification
        run: python scripts/verify_m8_current_certification.py --check
      - name: Re-run immutable M7 transfer verification
        run: python scripts/verify_m7_certification_transfer.py --check
