name: Verify RogSi targeted approval candidate once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-parnesse-targeted-v2-once.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Targeted current Oracle refresh for RogSi candidate
        run: python scripts/augment_rogsi_candidate_oracle_cache.py

      - name: Verify exact RogSi approval candidate
        run: python scripts/verify_rogsi_approval_candidate_once.py

      - name: Commit approval-ready evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refinement/metadata_audit/Current_Cycle_Oracle_Cache.jsonl \
                  refinement/metadata_audit/Current_Cycle_Oracle_Cache_Summary.json \
                  refinement/verification/RogSi_Whole_List_Audit_2026-10-15.md \
                  refinement/decisions/RogSi_Candidate_Decisions_2026-10-15.md \
                  refinement/verification/RogSi_Approval_Ready_Verification_2026-10-15.md \
                  refinement/verification/rogsi_2026-10-15/gate_output
          git commit -m "Verify RogSi approval-ready candidate [skip ci]"
          git push origin HEAD:main
