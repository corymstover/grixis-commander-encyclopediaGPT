name: Verify Solkanar the Tainted targeted approval candidate once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-parnesse-targeted-v2-once.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exact Solkanar the Tainted whole-list decision ledger
        run: python scripts/build_solkanar_tainted_decision_ledger.py

      - name: Targeted current Oracle refresh for Solkanar the Tainted candidate
        run: python scripts/augment_solkanar_tainted_candidate_oracle_cache.py

      - name: Verify exact Solkanar the Tainted approval candidate
        run: python scripts/verify_solkanar_tainted_approval_candidate_once.py

      - name: Commit approval-ready evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refinement/metadata_audit/Current_Cycle_Oracle_Cache.jsonl \
                  refinement/metadata_audit/Current_Cycle_Oracle_Cache_Summary.json \
                  refinement/verification/Solkanar_the_Tainted_Whole_List_Audit_2026-10-15.md \
                  refinement/decisions/Solkanar_the_Tainted_Whole_List_Decision_Ledger_2026-10-15.csv \
                  refinement/decisions/Solkanar_the_Tainted_Candidate_Decisions_2026-10-15.md \
                  refinement/verification/Solkanar_the_Tainted_Approval_Ready_Verification_2026-10-15.md \
                  refinement/verification/solkanar_tainted_2026-10-15/gate_output
          git commit -m "Verify Solkanar the Tainted approval-ready candidate [skip ci]"
          git push origin HEAD:main
