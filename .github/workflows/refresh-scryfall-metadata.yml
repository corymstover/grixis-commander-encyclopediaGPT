name: Refresh current Scryfall card metadata

on:
  push:
    branches: ["refinement/**"]
    paths:
      - "scripts/refresh_scryfall_metadata.py"
      - ".github/workflows/refresh-scryfall-metadata.yml"
      - "refinement/metadata_audit/REFRESH_REQUEST.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install streaming JSON parser
        run: python -m pip install --disable-pip-version-check ijson
      - name: Refresh exact-printing metadata
        run: python scripts/refresh_scryfall_metadata.py
      - name: Commit generated audit overlay
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refinement/metadata_audit/Current_Scryfall_Metadata_Overlay_2026-10-12.csv refinement/metadata_audit/Current_Scryfall_Metadata_Audit_Summary_2026-10-12.json
          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
            exit 0
          fi
          git commit -m "Refresh current Scryfall metadata [skip ci]"
          git push origin "HEAD:${BRANCH_NAME}"
