name: Refresh current Scryfall card metadata

on:
  push:
    branches: ["refinement/**", "automation/**"]
    paths:
      - "scripts/refresh_scryfall_metadata.py"
      - "scripts/validate_scryfall_metadata_refresh.py"
      - "scripts/audit_abaddon_baseline_metadata.py"
      - ".github/workflows/refresh-scryfall-metadata.yml"
      - "requirements-scryfall.txt"
      - "refinement/metadata_audit/REFRESH_REQUEST.md"
      - "refinement/metadata_audit/REFRESH_REQUEST*.md"
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# One run refreshes all 62 decks. Prevent redundant concurrent full-bulk downloads.
concurrency:
  group: scryfall-metadata-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scryfall.txt

      - name: Install refresh dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-scryfall.txt

      - name: Verify frozen 62-deck baseline before metadata download
        run: python scripts/verify_baseline.py

      - name: Refresh all 62 frozen decklists from current Scryfall bulk
        run: python scripts/refresh_scryfall_metadata.py

      - name: Validate snapshot freshness and completeness (fail closed)
        if: success()
        env:
          RUN_STARTED_AT: ${{ github.run_started_at }}
        run: >-
          python scripts/validate_scryfall_metadata_refresh.py
          --summary refinement/metadata_audit/Current_Scryfall_Metadata_Audit_Summary.json
          --report-output /tmp/scryfall-refresh-validation.json
          --not-before-utc "$RUN_STARTED_AT"
          --max-generated-age-hours 2
          --max-bulk-age-hours 72

      - name: Audit Abaddon's exact 94-name frozen list
        if: success()
        run: >-
          python scripts/audit_abaddon_baseline_metadata.py
          --json-output /tmp/abaddon-frozen-baseline-audit.json
          --csv-output /tmp/abaddon-frozen-baseline-audit.csv

      - name: Commit only validated current metadata
        if: success()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            refinement/metadata_audit/Current_Scryfall_Metadata_Overlay.csv \
            refinement/metadata_audit/Current_Scryfall_Metadata_Audit_Summary.json \
            refinement/metadata_audit/Current_Scryfall_Metadata_Overlay_2026-10-12.csv \
            refinement/metadata_audit/Current_Scryfall_Metadata_Audit_Summary_2026-10-12.json
          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
            exit 0
          fi
          git commit -m "Refresh validated current Scryfall metadata [skip ci]"
          git push origin "HEAD:$BRANCH_NAME"

      - name: Write refresh gate results to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Scryfall metadata refresh"
            echo
            if [[ -f /tmp/scryfall-refresh-validation.json ]]; then
              echo "### Freshness/completeness validator"
              cat /tmp/scryfall-refresh-validation.json
            else
              echo "No validator report was produced; refresh may have failed before metadata generation."
            fi
            if [[ -f /tmp/abaddon-frozen-baseline-audit.json ]]; then
              echo
              echo "### Abaddon 94-name audit"
              cat /tmp/abaddon-frozen-baseline-audit.json
            else
              echo
              echo "Abaddon audit not run or failed. Check the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve refresh evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scryfall-refresh-${{ github.run_id }}
          path: |
            refinement/metadata_audit/Current_Scryfall_Metadata_Audit_Summary.json
            refinement/metadata_audit/Current_Scryfall_Metadata_Overlay.csv
            refinement/metadata_audit/Current_Scryfall_Metadata_Audit_Summary_2026-10-12.json
            /tmp/scryfall-refresh-validation.json
            /tmp/abaddon-frozen-baseline-audit.json
            /tmp/abaddon-frozen-baseline-audit.csv
          if-no-files-found: warn
          retention-days: 60
