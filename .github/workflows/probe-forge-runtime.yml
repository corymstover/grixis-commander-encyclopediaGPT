name: Probe pinned Forge runtime and card-script coverage

on:
  workflow_dispatch:
  push:
    branches: ["refinement/**"]
    paths:
      - ".github/workflows/probe-forge-runtime.yml"
      - "refinement/variants/Abaddon_Aurora_Phoenix_Test_Variant_v1.txt"
      - "scripts/verify_abaddon_variant.py"
      - "scripts/probe_forge_card_coverage.py"
      - "tests/test_probe_forge_card_coverage.py"

permissions:
  contents: read

jobs:
  probe-forge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Verify isolated deck variant
        run: python scripts/verify_abaddon_variant.py

      - name: Test Forge coverage audit
        run: python -m unittest discover -s tests -p 'test_probe_forge_card_coverage.py' -v

      - name: Download pinned Forge release
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --retry 3 --retry-delay 2 \
            --output forge-installer-2.0.15.tar.bz2 \
            https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2
          echo "4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge-installer-2.0.15.tar.bz2" | sha256sum --check

      - name: Extract pinned release
        run: tar -xjf forge-installer-2.0.15.tar.bz2

      - name: Record runtime and launch Forge CLI probe
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | tee java-version.txt
          find . -maxdepth 2 -type f -name 'forge-gui-desktop-2.0.15-jar-with-dependencies.jar' -print | tee forge-jar-path.txt
          test -s forge-jar-path.txt
          JAR="$(head -1 forge-jar-path.txt)"
          # A successful parse-mode launch confirms only CLI startup, not gameplay rules.
          CODE=0
          timeout 90s java -jar "$JAR" parse > forge-startup.stdout.txt 2> forge-startup.stderr.txt || CODE=$?
          echo "$CODE" > forge-startup.exit-code.txt
          echo "CLI startup probe exit code: $CODE"
          cat forge-startup.stdout.txt || true
          cat forge-startup.stderr.txt || true

      - name: Check out pinned Forge card-script source
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: 4ec5f1a2c32fa90ecb983a72b9eb47aa5c5d7676
          path: forge-source
          fetch-depth: 1
          sparse-checkout: forge-gui/res/cardsfolder
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Verify pinned Forge source revision
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git -C forge-source rev-parse HEAD)"
          printf '%s\n' "$ACTUAL" | tee forge-source-commit.txt
          test "$ACTUAL" = "4ec5f1a2c32fa90ecb983a72b9eb47aa5c5d7676"

      - name: Scan test variant and baseline-only comparison card
        shell: bash
        run: |
          set -euo pipefail
          python scripts/probe_forge_card_coverage.py \
            --variant refinement/variants/Abaddon_Aurora_Phoenix_Test_Variant_v1.txt \
            --card-root forge-source/forge-gui/res/cardsfolder \
            --extra-card "Mind's Desire" \
            --output forge-card-script-coverage.json

      - name: Preserve probe logs and coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-2.0.15-runtime-probe
          path: |
            java-version.txt
            forge-jar-path.txt
            forge-startup.stdout.txt
            forge-startup.stderr.txt
            forge-startup.exit-code.txt
            forge-source-commit.txt
            forge-card-script-coverage.json
          if-no-files-found: warn
          retention-days: 30
