name: Probe pinned Forge runtime and card-script coverage

on:
  workflow_dispatch:
  push:
    branches: ["refinement/**"]
    paths:
      - ".github/workflows/probe-forge-runtime.yml"
      - "refinement/variants/Abaddon_Aurora_Phoenix_Test_Variant_v1.txt"
      - "scripts/verify_abaddon_variant.py"

permissions:
  contents: read

jobs:
  probe-forge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Verify isolated deck variant
        run: python scripts/verify_abaddon_variant.py

      - name: Download pinned Forge release
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --retry 3 --retry-delay 2 \
            --output forge-installer-2.0.15.tar.bz2 \
            https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2
          echo "4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge-installer-2.0.15.tar.bz2" | sha256sum --check

      - name: Extract pinned release
        run: tar -xjf forge-installer-2.0.15.tar.bz2

      - name: Record runtime and locate the distribution
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | tee java-version.txt
          find . -maxdepth 2 -type f -name 'forge-gui-desktop-2.0.15-jar-with-dependencies.jar' -print | tee forge-jar-path.txt
          test -s forge-jar-path.txt
          JAR="$(head -1 forge-jar-path.txt)"
          # Invoke documented parse mode without input to verify CLI mode parsing.
          # This is a startup/CLI probe, not a gameplay simulation.
          timeout 90s java -jar "$JAR" parse > forge-startup.stdout.txt 2> forge-startup.stderr.txt || CODE=$?
          CODE="${CODE:-0}"
          echo "$CODE" > forge-startup.exit-code.txt
          echo "Startup probe exit code: $CODE"
          # A nonzero or usage response is recorded; logs are retained for review.
          cat forge-startup.stdout.txt || true
          cat forge-startup.stderr.txt || true

      - name: Scan 94 unique card names against pinned Forge scripts
        shell: bash
        run: |
          python - <<'PY'
          import json, re, unicodedata
          from pathlib import Path

          variant = Path("refinement/variants/Abaddon_Aurora_Phoenix_Test_Variant_v1.txt")
          roots = [Path("res/cardsfolder")]
          if not roots[0].exists():
              roots = list(Path(".").glob("**/res/cardsfolder"))
          root = next((r for r in roots if r.exists()), None)
          if root is None:
              raise SystemExit("Forge res/cardsfolder directory not found")

          def norm(s):
              s = unicodedata.normalize("NFKD", s).encode("ascii", "ignore").decode("ascii")
              return re.sub(r"[^a-z0-9]", "", s.casefold())

          deck = []
          for line in variant.read_text(encoding="utf-8-sig").splitlines():
              line = line.strip()
              m = re.match(r"^\d+x\s+(.+?)\s*$", line)
              if not m:
                  continue
              name = re.sub(r"\s*\[Commander\]\s*$", "", m.group(1)).strip()
              deck.append(name)
          unique = list(dict.fromkeys(deck))
          scripts = {}
          for p in root.rglob("*.txt"):
              try:
                  body = p.read_text(encoding="utf-8", errors="replace")
              except OSError:
                  continue
              lines = body.splitlines()
              names = [line[5:].strip() for line in lines if line.startswith("Name:")]
              names += [line[len("AlternateName:"):].strip() for line in lines if line.startswith("AlternateName:")]
              oracle = any(line.startswith("Oracle:") for line in lines)
              record = {"path": str(p.relative_to(root)), "oracle": oracle, "declared_names": names}
              for nm in names:
                  scripts.setdefault(norm(nm), []).append(record)
              scripts.setdefault(norm(p.stem.replace("_", " ")), []).append(record)
              # Filename stems are a discovery heuristic, not a canonical Oracle name.
              # Positive controls below prevent treating a zero-match report as valid.
          rows = []
          for name in unique:
              front = name.split("//", 1)[0].strip() if "//" in name else name
              candidate_keys = {norm(name), norm(front)}
              matches = []
              for key in candidate_keys:
                  matches.extend(scripts.get(key, []))
              dedup = {x["path"]: x for x in matches}
              matches = list(dedup.values())
              status = "MATCH" if len(matches) == 1 and matches[0]["oracle"] else ("AMBIGUOUS" if len(matches) > 1 else "MISSING")
              rows.append({"deck_name": name, "status": status, "matches": [{"path":x["path"],"oracle":x["oracle"],"declared_names":x["declared_names"]} for x in matches]})
          report = {
              "release":"forge-2.0.15",
              "commit":"4ec5f1a2c32fa90ecb983a72b9eb47aa5c5d7676",
              "scan_type":"textual Name:/Oracle: card-script presence only; not rules correctness",
              "card_root":str(root),
              "unique_deck_names":len(unique),
              "match_count":sum(x["status"]=="MATCH" for x in rows),
              "missing_count":sum(x["status"]=="MISSING" for x in rows),
              "ambiguous_count":sum(x["status"]=="AMBIGUOUS" for x in rows),
              "results":rows
          }
          Path("forge-card-script-coverage.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps({k:report[k] for k in ("release","commit","card_root","unique_deck_names","match_count","missing_count","ambiguous_count")},indent=2))
          # Known positive controls prevent an all-zero false-negative scan from passing.
          by_name = {row["deck_name"]: row for row in rows}
          required = ["Abaddon the Despoiler", "Aurora Phoenix", "Mind's Desire", "Underworld Breach", "Brain Freeze", "Lion's Eye Diamond"]
          bad_required = [n for n in required if n not in by_name or by_name[n]["status"] != "MATCH"]
          if bad_required:
              raise SystemExit("Known positive-control mappings failed: " + ", ".join(bad_required))
          PY

      - name: Preserve probe logs and coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-2.0.15-runtime-probe
          path: |
            java-version.txt
            forge-jar-path.txt
            forge-startup.stdout.txt
            forge-startup.stderr.txt
            forge-startup.exit-code.txt
            forge-card-script-coverage.json
          if-no-files-found: warn
          retention-days: 30
