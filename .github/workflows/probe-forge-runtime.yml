name: Probe pinned Forge runtime and card-script coverage

on:
  workflow_dispatch:
  push:
    branches: ["refinement/**"]
    paths:
      - ".github/workflows/probe-forge-runtime.yml"
      - "refinement/variants/Abaddon_Aurora_Phoenix_Test_Variant_v1.txt"
      - "scripts/verify_abaddon_variant.py"
      - "scripts/probe_forge_card_coverage.py"
      - "scripts/prepare_abaddon_forge_smoke_decks.py"
      - "tests/test_probe_forge_card_coverage.py"
      - "tests/test_prepare_abaddon_forge_smoke_decks.py"

permissions:
  contents: read

jobs:
  probe-forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Verify isolated deck variant
        run: python scripts/verify_abaddon_variant.py

      - name: Run unit tests for audit and smoke-deck preparation
        run: python -m unittest discover -s tests -v

      - name: Download pinned Forge release
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --retry 3 --retry-delay 2 \
            --output forge-installer-2.0.15.tar.bz2 \
            https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2
          echo "4468f182b60f6ca62d89697baa208981085af744f116781af751c611826db600  forge-installer-2.0.15.tar.bz2" | sha256sum --check

      - name: Extract pinned release
        run: tar -xjf forge-installer-2.0.15.tar.bz2

      - name: Record runtime and launch Forge CLI probe
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | tee java-version.txt
          find . -maxdepth 2 -type f -name 'forge-gui-desktop-2.0.15-jar-with-dependencies.jar' -print | tee forge-jar-path.txt
          test -s forge-jar-path.txt
          JAR="$(head -1 forge-jar-path.txt)"
          # A successful parse-mode launch confirms only CLI startup, not gameplay rules.
          CODE=0
          timeout 90s java -jar "$JAR" parse > forge-startup.stdout.txt 2> forge-startup.stderr.txt || CODE=$?
          echo "$CODE" > forge-startup.exit-code.txt
          echo "CLI startup probe exit code: $CODE"
          cat forge-startup.stdout.txt || true
          cat forge-startup.stderr.txt || true

      - name: Check out pinned Forge card-script source
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: 4ec5f1a2c32fa90ecb983a72b9eb47aa5c5d7676
          path: forge-source
          fetch-depth: 1
          sparse-checkout: forge-gui/res/cardsfolder
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Verify pinned Forge source revision
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git -C forge-source rev-parse HEAD)"
          printf '%s\n' "$ACTUAL" | tee forge-source-commit.txt
          test "$ACTUAL" = "4ec5f1a2c32fa90ecb983a72b9eb47aa5c5d7676"

      - name: Scan test variant and baseline-only comparison card
        shell: bash
        run: |
          set -euo pipefail
          python scripts/probe_forge_card_coverage.py \
            --variant refinement/variants/Abaddon_Aurora_Phoenix_Test_Variant_v1.txt \
            --card-root forge-source/forge-gui/res/cardsfolder \
            --extra-card "Mind's Desire" \
            --extra-card "Obeka, Brute Chronologist" \
            --output forge-card-script-coverage.json

      - name: Generate hash-verified Forge deck-load fixtures
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_abaddon_forge_smoke_decks.py \
            --archive source-package/GrixisFINAL_62Decks_CSV_TXT_2026-10-12.tar.gz \
            --variant refinement/variants/Abaddon_Aurora_Phoenix_Test_Variant_v1.txt \
            --output-dir forge-smoke-decks | tee forge-smoke-deck-preparation.txt

      - name: Run repeated same-seed Commander runtime smoke tests
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(head -1 forge-jar-path.txt)"
          # This is only a repeatability/deck-load smoke test: the two Abaddon variants
          # play each other, so their winner is not evidence that either list is better.
          # The pinned CLI's -s flag seeds its RNG; full logs are retained for inspection.
          timeout 180s java -jar "$JAR" sim \
            -D "$PWD/forge-smoke-decks" \
            -d "Abaddon baseline.dck" "Abaddon Aurora Phoenix variant.dck" \
            -f Commander -n 1 -s 20261013 -c 20 2>&1 | tee forge-game-smoke-seed-20261013-a.log
          timeout 180s java -jar "$JAR" sim \
            -D "$PWD/forge-smoke-decks" \
            -d "Abaddon baseline.dck" "Abaddon Aurora Phoenix variant.dck" \
            -f Commander -n 1 -s 20261013 -c 20 2>&1 | tee forge-game-smoke-seed-20261013-b.log
          grep -Ei 'winner|wins|draw|match|Game Result|Game Outcome' forge-game-smoke-seed-20261013-a.log > forge-game-smoke-summary.txt
          test -s forge-game-smoke-summary.txt
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          HEADER = "Ai(1)-Abaddon frozen baseline vs Ai(2)-Abaddon Aurora Phoenix test variant - one game of Commander seed 20261013"

          def normalize_match(path):
              lines = Path(path).read_text(encoding="utf-8", errors="replace").splitlines()
              starts = [i for i, line in enumerate(lines) if HEADER in line]
              if len(starts) != 1:
                  raise RuntimeError(f"{path}: expected one match header, found {len(starts)}")
              start = starts[0]
              end = next((i for i in range(start, len(lines)) if "Game Result: Game 1 ended" in lines[i]), None)
              if end is None:
                  raise RuntimeError(f"{path}: Game Result line not found")
              block = lines[start:end + 1]
              normalized = []
              for line in block:
                  line = re.sub(r"^\d{4}-\d\d-\d\dT[^\s]+Z\s*", "", line)
                  line = re.sub(r"\x1b\[[0-9;]*m", "", line)
                  line = re.sub(r"^\d{2}:\d{2}:\d{2}\s+\[INFO\s*\]\s*", "", line)
                  line = re.sub(r"(?i)(took|ended in)\s+[0-9,]+\s+ms", r"\1 <ELAPSED_MS> ms", line)
                  line = re.sub(r"Match Duration \d+m : \d+s", "Match Duration <DURATION>", line)
                  normalized.append(line)
              return "\n".join(normalized)

          a = normalize_match("forge-game-smoke-seed-20261013-a.log")
          b = normalize_match("forge-game-smoke-seed-20261013-b.log")
          report = {
              "seed": 20261013,
              "release": "forge-2.0.15",
              "same_command_same_seed": True,
              "normalized_match_event_logs_identical": a == b,
              "match_log_a_sha256": hashlib.sha256(a.encode()).hexdigest(),
              "match_log_b_sha256": hashlib.sha256(b.encode()).hexdigest(),
              "purpose": "single-game replay determinism probe only; not a deck-performance comparison",
              "limitations": [
                  "This verifies repeatability of the observed match log, not independent identity of each starting hand or library permutation.",
                  "This does not validate Abaddon, cascade, storm, escape, or graveyard interactions.",
                  "Forge AI performance is conditional on its heuristics and is not real-world win-rate evidence."
              ]
          }
          Path("forge-seed-replay-report.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY

      - name: Run registered Phase B observability pilot against a fixed Commander opponent (unpaired)
        shell: bash
        run: |
          set -uo pipefail
          cat > "forge-smoke-decks/Obeka neutral test fixture.dck" <<'EOF'
          [metadata]
          Name=Obeka neutral test fixture
          [Commander]
          1 Obeka, Brute Chronologist
          [Main]
          99 Island
          [Sideboard]
          EOF
          JAR="$(head -1 forge-jar-path.txt)"
          : > forge-aurora-fixed-summary.txt
          for SEED in 20261021 20261022 20261023; do
            for VARIANT in baseline aurora; do
              if [ "$VARIANT" = "baseline" ]; then
                DECK="Abaddon baseline.dck"
              else
                DECK="Abaddon Aurora Phoenix variant.dck"
              fi
              LOG_FILE="$(printf 'forge-aurora-fixed-%s-%s.log' "$VARIANT" "$SEED")"
              CODE=0
              timeout 100s java -jar "$JAR" sim \
                -D "$PWD/forge-smoke-decks" \
                -d "$DECK" "Obeka neutral test fixture.dck" \
                -f Commander -n 1 -s "$SEED" -c 60 \
                > "$LOG_FILE" 2>&1 || CODE=$?
              printf 'seed=%s variant=%s exit_code=%s log_file=%s\n' "$SEED" "$VARIANT" "$CODE" "$LOG_FILE" | tee -a forge-aurora-fixed-summary.txt
            done
          done
          python - <<'PY'
          import json, re
          from pathlib import Path

          labels = (
              "Ai(1)-Abaddon frozen baseline",
              "Ai(1)-Abaddon Aurora Phoenix test variant",
              "Ai(2)-Obeka neutral test fixture",
          )
          status = {}
          for line in Path("forge-aurora-fixed-summary.txt").read_text(encoding="utf-8").splitlines():
              match = re.search(r"seed=(\d+)\s+variant=(baseline|aurora)\s+exit_code=(-?\d+)", line)
              if match:
                  status[(int(match.group(1)), match.group(2))] = int(match.group(3))

          rows = []
          for seed in (20261021, 20261022, 20261023):
              for variant in ("baseline", "aurora"):
                  path = Path(f"forge-aurora-fixed-{variant}-{seed}.log")
                  if not path.is_file() or path.stat().st_size == 0:
                      raise RuntimeError(f"Missing or empty Forge log: {path}")
                  raw = path.read_text(encoding="utf-8", errors="replace").splitlines()
                  clean = [re.sub(r"\x1b\[[0-9;]*m", "", line) for line in raw]
                  # Strip player/deck labels so the word "Aurora Phoenix" in the
                  # variant's display name can never masquerade as a card event.
                  events = [line for line in clean]
                  for label in labels:
                      events = [line.replace(label, "") for line in events]
                  cast_lines = [
                      clean[i] for i, line in enumerate(events)
                      if re.search(r"\bcast Aurora Phoenix\b", line, re.I)
                  ]
                  return_lines = [
                      clean[i] for i, line in enumerate(events)
                      if re.search(r"\bAurora Phoenix\b", line, re.I)
                      and re.search(
                          r"\b(triggered|trigger|resolve stack|add to stack)\b|return .*graveyard|graveyard to .*hand",
                          line, re.I
                      )
                  ]
                  result_lines = [line for line in clean if "Game Result: Game 1 ended" in line]
                  rows.append({
                      "seed": seed,
                      "deck_variant": variant,
                      "exit_code": status.get((seed, variant)),
                      "game_result_lines": result_lines,
                      "turn_lines": [line for line in clean if "Game Outcome: Turn " in line],
                      "aurora_cast_event_lines": cast_lines,
                      "aurora_graveyard_return_event_lines": return_lines,
                      "aurora_cast_observed": bool(cast_lines),
                      "aurora_return_event_observed": bool(return_lines),
                      "cascade_log_line_count": sum("cascade" in line.casefold() for line in clean),
                      "explicit_timeout_draw": any("Stopping slow match as draw" in line for line in clean),
                      "steam_vents_activator_warning_count": sum("Steam Vents Did not have activator set" in line for line in clean),
                      "log_file": str(path),
                  })

          report = {
              "purpose": "registered Phase B event-observability pilot; explicitly unpaired; not a performance comparison",
              "release": "forge-2.0.15",
              "fixed_opponent": "Obeka, Brute Chronologist with 99 Islands; an intentionally non-interactive test fixture, not a competitive benchmark",
              "same_numeric_seeds_and_seat_order": True,
              "matched_starting_hands_or_library_order_verified": False,
              "required_games": 6,
              "games_logged": len(rows),
              "results": rows,
              "limitations": [
                  "Forge Deck/CardPool import does not guarantee preserving deck-text order, so equal seeds do not prove matched initial hands or library orders.",
                  "The opponent is a deliberately passive test fixture used only to give the engine a stable Commander-mode runtime target.",
                  "AI decisions and winners are not evidence of real-world Commander performance.",
                  "If Aurora is not cast or its return trigger never occurs, this pilot does not establish that the rules implementation is wrong; it establishes that this AI run did not exercise the interaction.",
                  "This is not the 200-pair confirmatory test and does not authorize a decklist change."
              ]
          }
          Path("forge-aurora-fixed-report.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "purpose": report["purpose"],
              "games_logged": report["games_logged"],
              "results": [{
                  "seed": r["seed"],
                  "deck_variant": r["deck_variant"],
                  "exit_code": r["exit_code"],
                  "aurora_cast_observed": r["aurora_cast_observed"],
                  "aurora_return_event_observed": r["aurora_return_event_observed"],
                  "game_result_lines": r["game_result_lines"],
                  "explicit_timeout_draw": r["explicit_timeout_draw"]
              } for r in rows]
          }, indent=2))
          PY

      - name: Preserve probe logs and coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-2.0.15-runtime-probe
          path: |
            java-version.txt
            forge-jar-path.txt
            forge-startup.stdout.txt
            forge-startup.stderr.txt
            forge-startup.exit-code.txt
            forge-source-commit.txt
            forge-card-script-coverage.json
            forge-smoke-deck-preparation.txt
            forge-game-smoke-seed-20261013-a.log
            forge-game-smoke-seed-20261013-b.log
            forge-seed-replay-report.json
            forge-aurora-targeted-*.log
            forge-aurora-targeted-summary.txt
            forge-aurora-targeted-report.json
            forge-aurora-fixed-*.log
            forge-aurora-fixed-summary.txt
            forge-aurora-fixed-report.json
            forge-smoke-decks/Obeka\ neutral\ test\ fixture.dck
            forge-game-smoke-summary.txt
            forge-smoke-decks/*.dck
            forge-smoke-decks/smoke-deck-manifest.json
          if-no-files-found: warn
          retention-days: 30
