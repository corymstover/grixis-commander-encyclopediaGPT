name: Lock Doctor Doom Current Cycle

on:
  push:
    paths:
      - '.github/workflows/lock-doctor-doom-current-cycle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock Doctor Doom and reconcile tracker
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          state_path = Path('state/current_deck_overrides.json')
          tracker_path = Path('refinement/Deck_Refinement_Tracker_2026-10-12.csv')
          canonical_sha = 'c97bd448aa4b18d2f7ed15e5d67006ab320ed67ad3ed267e44150de472e1dc58'
          approval_date = '2026-10-14'
          deck_key = 'Doctor_Doom__King_of_Latveria'

          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['decks'][deck_key] = {
              'approval_status': 'APPROVED',
              'lock_status': 'LOCKED',
              'final_gate_passed': True,
              'user_approval_date': approval_date,
              'current_stage': 'LOCKED',
              'approved_list_sha256': canonical_sha,
              'quality_gate_version': 'Deck Quality Gates v3 + mandatory whole-list audit',
              'approval_basis': 'Explicit user approval of the exact SHA-bound Doctor Doom approval candidate after mandatory 99-slot whole-list audit, candidate exhaustion, red-team review, zero-new-material-improvement closure, fresh Oracle/rules verification, current official Commander legality verification, and complete structural gate PASS.',
              'complete_gate_artifact': 'refinement/verification/doctor_doom_king_of_latveria_2026-10-14/gate_output/Doctor_Doom_King_of_Latveria_2026-10-14_Complete_Gate.json',
              'whole_list_audit_artifact': 'refinement/decisions/Doctor_Doom_King_of_Latveria_Current_Cycle_Decisions_2026-10-14.md',
              'approved_list_artifact': 'refinement/decklists/Doctor_Doom_King_of_Latveria_Approved_2026-10-14.txt'
          }
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          with tracker_path.open(newline='', encoding='utf-8-sig') as f:
              reader = csv.DictReader(f)
              fieldnames = reader.fieldnames
              rows = list(reader)

          found = False
          for row in rows:
              if row['deck_id'] != deck_key:
                  continue
              found = True
              row['baseline_status'] = 'CURRENT APPROVED FINAL LIST — current-cycle canonical list locked; frozen source exports preserved unchanged.'
              row['commander_blueprint_complete'] = 'PASS — current-cycle commander-first blueprint complete; separate land-discard events and Villain/connive identity established.'
              row['high_impact_candidate_triage_complete'] = 'PASS — ranked candidates, audit-only discrepancy cards, and outside challengers reviewed; rankings used as discovery evidence only.'
              row['swap_decision_ledger_complete'] = 'PASS — six commander-first changes explicitly approved and frozen in the current-cycle canonical list.'
              row['combo_rules_interactions_verified'] = 'PASS — Doom land-discard event counting, copy effects, Roaming Throne, and Dakmor repeatable engines independently reviewed; no false infinite claim.'
              row['consistency_test_complete'] = 'PASS — exact 100-card list, 100 distinct names, 38 lands, singleton compliance, role balance, and zero-new-material-improvement closure verified.'
              row['multiplayer_test_complete_or_reason_not_applicable'] = 'NOT APPLICABLE AS A FINALIZATION GATE — no gameplay win-rate claim required.'
              row['final_gate_passed'] = 'YES'
              row['final_list_hash'] = canonical_sha
              row['user_approval_date'] = approval_date
              row['refinement_status'] = 'APPROVED / LOCKED — current global-restart-2026-10-13 cycle'
              note = (
                  ' CURRENT-CYCLE RECONCILIATION 2026-10-14: authoritative state/current_deck_overrides.json records Doctor Doom APPROVED and LOCKED after explicit user approval. '
                  f'Current-cycle canonical SHA-256: {canonical_sha}. Six approved changes: Liliana\'s Caress -> Glorious Purpose; Geth\'s Grimoire -> Chameleon, Master of Disguise; Waste Not -> Roaming Throne; Dark Deal -> Psychic Frog; Oskar, Rubbish Reclaimer -> Spark Double; Smoldering Marsh -> Dakmor Salvage. Frozen historical source exports remain unchanged.'
              )
              if canonical_sha not in (row.get('notes') or ''):
                  row['notes'] = ((row.get('notes') or '').rstrip() + note).strip()
              break
          if not found:
              raise SystemExit('Doctor Doom tracker row not found')

          with tracker_path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
          PY

      - name: Commit lock state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'grixis-lock-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/current_deck_overrides.json refinement/Deck_Refinement_Tracker_2026-10-12.csv
          if git diff --cached --quiet; then
            echo 'State and tracker already synchronized.'
            exit 0
          fi
          git commit -m 'Lock approved Doctor Doom deck in current cycle'
          git push
