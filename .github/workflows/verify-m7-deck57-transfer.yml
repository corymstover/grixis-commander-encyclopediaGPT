name: "M7 Deck 57 source-bound case transfer — focused only"

on:
  pull_request:
    paths:
      - "refinement/verification/m7_certification_transfer/The_Rani_924296ed24fdc5e7.json"
      - "state/current_deck_overrides.json"
      - "refinement/decklists/The_Rani_M7_Rev1_Approved_2026-10-27.txt"
      - ".github/workflows/verify-m7-deck57-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-exact-rani-owner-case-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check exact owner-approved raw 100, source plan, five P0 and nine explicit P1 deferrals
        run: |
          python3 - <<'PY'
          import json
          from scripts.verify_m7_certification_transfer import ROOT, validate_attestation
          n = "The_Rani"
          r = json.loads((ROOT / "state/current_deck_overrides.json").read_text())["decks"][n]
          p = json.loads((ROOT / "refinement/verification/m7_certification_transfer/m6_required_cases_2026-10-24.json").read_text())["decks"][n]
          a = json.loads((ROOT / "refinement/verification/m7_certification_transfer/The_Rani_924296ed24fdc5e7.json").read_text())
          validate_attestation(ROOT, n, r, p, a)
          assert sum(c["status"] == "PASSED" for c in a["m6_transfer"]["P0"]) == 5
          assert sum(c["status"] == "DEFERRED" for c in a["m6_transfer"]["P1"]) == 9
          print("PASS Deck57 owner-approved exact-100 transfer provenance — five bounded P0, nine transparently deferred P1")
          print("This is NOT the whole-registry gate, independent I/J certification, or full Magic simulation")
          PY
